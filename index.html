<!doctype html>
<html lang="da" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Rulers of the Map – World Conquest</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The map fills the screen; players, buttons and the turn panel lie on top of it. -->
  <main id="board-wrap">
    <svg id="board" role="img" data-label="board"></svg>
  </main>

  <header id="hud">
    <button id="home-btn" class="icon" data-label="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4m0 1h11l-2 4 2 4H5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
    </button>
    <ol id="players" data-label="players"></ol>
  </header>
  <div id="zoom">
    <button id="zoom-in" class="icon" data-label="zoomIn">+</button>
    <button id="zoom-out" class="icon" data-label="zoomOut">−</button>
  </div>
  <div id="dice" aria-live="polite" hidden></div>
  <div id="toast" aria-live="polite" hidden></div>

  <footer id="bar">
    <div class="bar-top">
      <p id="phase"></p>
      <div id="hand-buttons">
        <button id="mission-btn" hidden data-t="mission"></button>
        <button id="luck-btn" hidden></button>
      </div>
    </div>
    <p id="reserve" hidden><b></b><span></span></p>
    <p id="hint" aria-live="polite"></p>
    <div id="stepper" hidden>
      <button id="minus" data-label="fewer">−</button>
      <output id="amount"></output>
      <button id="plus" data-label="more">+</button>
    </div>
    <div id="actions"></div>
  </footer>

  <!-- The start screen. Also where you come back to from the flag in the corner. -->
  <section id="intro" data-label="startScreen">
    <div class="intro-card"><div class="intro-scroll">
      <h1 id="intro-title"><span>Rulers</span> <span>of the Map</span></h1>
      <p class="intro-sub" data-t="tagline"></p>
      <!-- The first time: a name and a coat of arms, then the two ways to play. -->
      <div id="welcome" hidden>
        <div id="welcome-name">
          <h2 class="welcome-h" data-t="welcome"></h2>
          <p data-t="whatName"></p>
          <div class="person welcome-person">
            <button type="button" class="person-look" id="welcome-look" data-label="changeArms" aria-expanded="false"></button>
            <input type="text" id="welcome-input" maxlength="14" spellcheck="false" enterkeyhint="done" data-label="yourName">
          </div>
          <div class="looks" id="welcome-looks" hidden></div>
          <button type="button" class="primary wide" id="welcome-next" data-t="next"></button>
        </div>
        <div id="welcome-ways" hidden>
          <h2 class="welcome-h" id="welcome-hello"></h2>
          <p data-t="howPlay"></p>
          <button type="button" class="choice" id="choose-togter"><b data-t="togterTitle"></b><span data-t="togterPitch"></span></button>
          <button type="button" class="choice" id="choose-free"><b data-t="freeGame"></b><span data-t="freePitch"></span></button>
          <p class="sub" data-t="switchLater"></p>
        </div>
      </div>
      <div id="menu">
        <div class="intro-buttons">
          <button type="button" class="primary wide" id="intro-continue" hidden data-t="continue"></button>
          <button type="button" class="wide" id="intro-togter" data-t="togterTitle"></button>
          <p class="intro-setup" id="togt-summary"></p>
          <button type="button" class="wide" id="intro-new" data-t="freeGame"></button>
          <p class="intro-setup" id="intro-summary"></p>
        </div>
        <details class="fold intro-rules" id="intro-rules">
          <summary data-t="howToPlay"></summary>
          <ul data-html="rules"></ul>
          <p class="credits" data-html="credits"></p>
        </details>
        <button type="button" class="link" id="settings-btn" data-t="settings"></button>
      </div>
      <div class="publisher">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="64 24 424 432" class="pub-logo" aria-hidden="true">
          <ellipse cx="256" cy="412" rx="170" ry="34" fill="#F7ECD6" stroke="#123D30" stroke-width="14"/>
          <ellipse cx="256" cy="406" rx="116" ry="16" fill="#E6D4B0"/>
          <path d="M362 280C452 262 464 384 350 382" fill="none" stroke="#123D30" stroke-width="56" stroke-linecap="round"/>
          <path d="M362 280C452 262 464 384 350 382" fill="none" stroke="#F7ECD6" stroke-width="28" stroke-linecap="round"/>
          <path d="M134 248C134 352 186 422 256 422C326 422 378 352 378 248Z" fill="#F7ECD6" stroke="#123D30" stroke-width="14" stroke-linejoin="round"/>
          <path d="M346 270C346 342 316 394 276 412C340 406 370 352 372 270Z" fill="#E6D4B0"/>
          <ellipse cx="256" cy="248" rx="122" ry="34" fill="#F7ECD6" stroke="#123D30" stroke-width="14"/>
          <ellipse cx="256" cy="250" rx="100" ry="22" fill="#3A2316"/>
          <ellipse cx="272" cy="252" rx="48" ry="11" fill="#8A5A3C"/>
          <ellipse cx="280" cy="252" rx="24" ry="5" fill="#3A2316"/>
          <path d="M196 330Q212 312 228 330M284 330Q300 312 316 330M232 352Q256 378 280 352" fill="none" stroke="#123D30" stroke-width="11" stroke-linecap="round"/>
          <circle cx="184" cy="356" r="15" fill="#F2A0A0"/>
          <circle cx="328" cy="356" r="15" fill="#F2A0A0"/>
          <g class="steam">
            <path d="M262 244C270 228 250 214 256 192C220 160 172 136 172 100C172 72 194 56 216 56C236 56 250 68 256 84C262 68 276 56 296 56C318 56 340 72 340 100C340 136 292 160 256 192" fill="none" stroke="#123D30" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M262 244C270 228 250 214 256 192C220 160 172 136 172 100C172 72 194 56 216 56C236 56 250 68 256 84C262 68 276 56 296 56C318 56 340 72 340 100C340 136 292 160 256 192" fill="none" stroke="#F7ECD6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
        <span><span data-t="gameBy"></span><b>Trippus Games</b></span>
      </div>
    </div></div>
  </section>

  <!-- A togt begins: the year, the war and the story, before the map comes into view. -->
  <section id="chapter" hidden>
    <div class="ch-art" id="ch-art" aria-hidden="true"></div>
    <button id="ch-home" class="icon" data-label="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4m0 1h11l-2 4 2 4H5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
    </button>
    <div class="ch-card">
      <p class="ch-step" id="ch-step"></p>
      <p class="ch-year" id="ch-year"></p>
      <svg class="ch-rule" viewBox="0 0 220 12" aria-hidden="true">
        <path d="M2 6H96M124 6H218" pathLength="1"/>
        <path d="M110 1L116 6L110 11L104 6Z" pathLength="1"/>
      </svg>
      <h2 class="ch-title" id="ch-title"></h2>
      <p class="ch-story" id="ch-story"></p>
      <p class="ch-goal-h" id="ch-goal-h" data-t="yourGoal"></p>
      <div class="ch-mode" id="ch-mode" role="group"></div>
      <p class="ch-goal" id="ch-goal"></p>
      <button type="button" class="primary" id="ch-go" data-t="toBattle"></button>
      <button type="button" class="link" id="ch-standings" data-t="seeStandings" hidden></button>
      <button type="button" class="link" id="ch-easy" data-t="tryEasy" hidden></button>
    </div>
  </section>

  <dialog id="togter">
    <form method="dialog">
      <h2 data-t="togterTitle"></h2>
      <p class="sub" data-t="togterLead"></p>
      <div class="field"><span data-t="togtLevel"></span><div class="pills" id="togt-level"></div></div>
      <ol class="togt-list" id="togt-list"></ol>
      <div class="buttons"><button value="cancel" data-t="back"></button></div>
    </form>
  </dialog>

  <dialog id="new-game">
    <form method="dialog">
      <h2 data-t="freeGame"></h2>
      <!-- The map first, and how it is won right under it; then the computer players; the people at
           this device, rarely changed, folded away. -->
      <section class="group">
        <div class="field"><span data-t="map"></span><div class="pills" data-name="map"></div>
          <p class="sub locked-note" id="locked-note" data-t="lockedMaps"></p></div>
        <div class="field"><span data-t="victory"></span><div class="pills" data-name="mode"></div></div>
      </section>
      <section class="group">
        <div class="field"><span data-t="computerPlayers"></span><div class="pills" data-name="opponents"></div></div>
        <div id="bot-fields">
          <div class="field"><span data-t="computerLevel"></span><div class="pills" data-name="level"></div></div>
        </div>
      </section>
      <details class="fold" id="people-fold">
        <summary><span><span data-t="peopleHere"></span>: <span id="people-names"></span></span></summary>
        <ol class="people" id="people"></ol>
        <button type="button" class="link add-person" id="add-person" data-t="addPerson"></button>
      </details>
      <p class="sub" data-t="fairStart"></p>
      <div class="buttons">
        <button value="cancel" id="cancel-new" data-t="back"></button>
        <button value="start" class="primary" id="start" data-t="start"></button>
      </div>
    </form>
  </dialog>

  <dialog id="settings">
    <form method="dialog">
      <h2 data-t="settings"></h2>
      <div class="field"><span data-t="sound"></span><div class="pills" id="sound-pills"></div></div>
      <div class="field"><span data-t="music"></span><div class="pills" id="music-pills"></div></div>
      <div class="field"><span data-t="look"></span><div class="pills" id="theme-pills"></div></div>
      <div class="field"><span data-t="language"></span><div class="pills" id="lang-pills"></div></div>
      <div class="buttons"><button value="ok" class="primary" data-t="ok">OK</button></div>
    </form>
  </dialog>

  <dialog id="mission-dialog">
    <form method="dialog">
      <h2 id="mission-title" data-t="yourMission"></h2>
      <p class="sub" id="mission-who"></p>
      <p id="mission-text" class="big"></p>
      <div id="mission-map" class="mission-map"></div>
      <p id="mission-progress"></p>
      <p class="sub" id="mission-note" data-t="missionSecret"></p>
      <div class="buttons"><button value="ok" class="primary" data-t="ok">OK</button></div>
    </form>
  </dialog>

  <dialog id="luck-dialog">
    <form method="dialog">
      <h2 data-t="luck"></h2>
      <p class="sub" id="luck-who"></p>
      <p class="stars-big" id="luck-stars"></p>
      <p id="luck-text"></p>
      <ul class="luck-rules">
        <li data-t="luckRule1"></li>
        <li data-t="luckRule2"></li>
      </ul>
      <div id="ladder"></div>
      <ul class="luck-rules">
        <li data-t="luckRule3"></li>
      </ul>
      <div class="buttons">
        <button value="ok" data-t="ok">OK</button>
        <button value="luck" class="primary" id="cash-btn" data-t="cashIn"></button>
      </div>
    </form>
  </dialog>

  <dialog id="game-over" data-label="gameOver">
    <form method="dialog">
      <div class="ruler" id="over-ruler"></div>
      <div id="over-text"></div>
      <div class="buttons">
        <button value="home" data-t="toStart"></button>
        <button value="again" class="primary" id="over-again"></button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
