<!doctype html>
<html lang="da" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Rulers of the Map – World Conquest</title>
  <!-- The icon (tools/make-icons.mjs); with the manifest the game can lie on the home screen as an app. -->
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0c0703">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- The map fills the screen; players, buttons and the turn panel lie on top of it. -->
  <main id="board-wrap">
    <svg id="board" role="img" data-label="board"></svg>
  </main>

  <header id="hud">
    <button id="home-btn" class="icon" data-label="menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <ol id="players" data-label="players"></ol>
  </header>
  <div id="zoom">
    <button id="zoom-in" class="icon" data-label="zoomIn">+</button>
    <button id="zoom-out" class="icon" data-label="zoomOut">−</button>
  </div>
  <div id="dice" aria-live="polite" hidden></div>
  <div id="toast" aria-live="polite" hidden></div>

  <footer id="bar">
    <div id="guide" aria-live="polite" hidden>
      <p id="guide-text"></p>
      <button type="button" id="guide-ok" data-t="gotIt" hidden></button>
      <button type="button" id="guide-skip" data-label="skipGuide">×</button>
    </div>
    <div class="bar-top">
      <p id="phase"></p>
      <div id="hand-buttons">
        <button id="mission-btn" hidden data-t="mission" data-key="mission"></button>
        <button id="luck-btn" hidden></button>
      </div>
    </div>
    <p id="reserve" hidden><b></b><span></span><button type="button" id="undo" data-t="undo" hidden></button></p>
    <p id="hint" aria-live="polite"></p>
    <div id="stepper" hidden>
      <button id="minus" data-label="fewer">−</button>
      <output id="amount"></output>
      <button id="plus" data-label="more">+</button>
    </div>
    <div id="actions"></div>
  </footer>

  <!-- The start screen. Also where you come back to from the menu in the corner. -->
  <section id="intro" data-label="startScreen">
    <div class="intro-art" id="intro-art" aria-hidden="true"></div>
    <div class="intro-shade" aria-hidden="true"></div>
    <div class="intro-card"><div class="intro-scroll">
      <!-- The first time: cards to swipe through, and last your name and how to begin. -->
      <div id="welcome" hidden>
        <button type="button" class="link welcome-lang" id="welcome-lang"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span></span></button>
        <div class="slides" id="slides">
          <section class="slide" data-art="assets/togter/italy.jpg">
            <p class="slide-title"><span>Rulers</span> <span>of the Map</span></p>
            <svg class="ch-rule" viewBox="0 0 220 12" aria-hidden="true">
              <path d="M2 6H96M124 6H218" pathLength="1"/>
              <path d="M110 1L116 6L110 11L104 6Z" pathLength="1"/>
            </svg>
            <p class="slide-big" data-t="slideAim"></p>
          </section>
          <section class="slide" data-art="assets/togter/vikings.jpg">
            <h2 class="welcome-h" data-t="slideWays"></h2>
            <div class="way">
              <span class="way-pic" style="background-image: url('assets/togter/napoleon.jpg')"></span>
              <p><b data-t="togterTitle"></b> <span data-t="togterPitch"></span></p>
            </div>
            <div class="way">
              <span class="way-pic" style="background-image: url('assets/maps/world.jpg')"></span>
              <p><b data-t="freeGame"></b> <span data-t="freePitch"></span></p>
            </div>
          </section>
          <section class="slide" data-art="assets/togter/genghis.jpg">
            <h2 class="welcome-h" data-t="slideTurn"></h2>
            <ol class="turn">
              <li><span class="scene"><i class="tok">4</i><em>+3</em></span><p data-html="turnPlace"></p></li>
              <li><span class="scene"><i class="tok">5</i><svg class="to" viewBox="0 0 24 12" aria-hidden="true"><path d="M1 6h17M14 1l7 5-7 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><i class="tok foe">2</i></span><p data-html="turnAttack"></p></li>
              <li><span class="scene"><i class="tok">6</i><svg class="to" viewBox="0 0 24 12" aria-hidden="true"><path d="M1 6h17M14 1l7 5-7 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/></svg><i class="tok">1</i></span><p data-html="turnMove"></p></li>
            </ol>
            <p class="turn-goal" data-t="turnGoal"></p>
          </section>
          <section class="slide" data-art="assets/togter/england.jpg">
            <h2 class="welcome-h" data-t="whatName"></h2>
            <p data-t="nameNote"></p>
            <div class="person welcome-person">
              <input type="text" id="welcome-input" maxlength="14" spellcheck="false" enterkeyhint="done" data-label="yourName">
            </div>
            <div class="looks" id="welcome-looks"></div>
            <div class="field"><span data-t="togtLevel"></span><div class="pills" id="welcome-level"></div></div>
            <button type="button" class="primary wide" id="choose-togter" data-t="startFirst"></button>
            <button type="button" class="wide" id="choose-free" data-t="freeGame"></button>
          </section>
        </div>
        <div class="slide-foot">
          <div class="dots" id="slide-dots" aria-hidden="true"></div>
          <button type="button" class="primary" id="slide-next" data-t="next"></button>
          <button type="button" class="link" id="slide-skip" data-t="skip"></button>
        </div>
      </div>
      <div id="menu">
        <button type="button" id="intro-menu" class="icon" data-label="menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <h1 id="intro-title"><span>Rulers</span> <span>of the Map</span></h1>
        <p class="intro-sub" data-t="tagline"></p>
        <div class="intro-buttons">
          <button type="button" class="primary wide" id="intro-continue" hidden data-t="continue"></button>
          <button type="button" class="wide" id="intro-togter" data-t="togterTitle"></button>
          <p class="intro-setup" id="togt-summary"></p>
          <button type="button" class="wide" id="intro-new" data-t="freeGame"></button>
          <p class="intro-setup" id="intro-summary"></p>
        </div>
        <div class="intro-links">
          <button type="button" class="link" id="how-to-btn" data-t="howToPlay"></button>
          <button type="button" class="link" id="settings-btn" data-t="settings"></button>
          <button type="button" class="link" id="stats-btn" data-t="stats"></button>
        </div>
        <div class="publisher">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="64 24 424 432" class="pub-logo" aria-hidden="true">
            <ellipse cx="256" cy="412" rx="170" ry="34" fill="#F7ECD6" stroke="#123D30" stroke-width="14"/>
            <ellipse cx="256" cy="406" rx="116" ry="16" fill="#E6D4B0"/>
            <path d="M362 280C452 262 464 384 350 382" fill="none" stroke="#123D30" stroke-width="56" stroke-linecap="round"/>
            <path d="M362 280C452 262 464 384 350 382" fill="none" stroke="#F7ECD6" stroke-width="28" stroke-linecap="round"/>
            <path d="M134 248C134 352 186 422 256 422C326 422 378 352 378 248Z" fill="#F7ECD6" stroke="#123D30" stroke-width="14" stroke-linejoin="round"/>
            <path d="M346 270C346 342 316 394 276 412C340 406 370 352 372 270Z" fill="#E6D4B0"/>
            <ellipse cx="256" cy="248" rx="122" ry="34" fill="#F7ECD6" stroke="#123D30" stroke-width="14"/>
            <ellipse cx="256" cy="250" rx="100" ry="22" fill="#3A2316"/>
            <ellipse cx="272" cy="252" rx="48" ry="11" fill="#8A5A3C"/>
            <ellipse cx="280" cy="252" rx="24" ry="5" fill="#3A2316"/>
            <path d="M196 330Q212 312 228 330M284 330Q300 312 316 330M232 352Q256 378 280 352" fill="none" stroke="#123D30" stroke-width="11" stroke-linecap="round"/>
            <circle cx="184" cy="356" r="15" fill="#F2A0A0"/>
            <circle cx="328" cy="356" r="15" fill="#F2A0A0"/>
            <g class="steam">
              <path d="M262 244C270 228 250 214 256 192C220 160 172 136 172 100C172 72 194 56 216 56C236 56 250 68 256 84C262 68 276 56 296 56C318 56 340 72 340 100C340 136 292 160 256 192" fill="none" stroke="#123D30" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M262 244C270 228 250 214 256 192C220 160 172 136 172 100C172 72 194 56 216 56C236 56 250 68 256 84C262 68 276 56 296 56C318 56 340 72 340 100C340 136 292 160 256 192" fill="none" stroke="#F7ECD6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </svg>
          <span><span data-t="gameBy"></span><b>Trippus Games</b></span>
        </div>
      </div>
    </div></div>
  </section>

  <!-- A togt begins: the year, the war and the story, before the map comes into view. -->
  <section id="chapter" hidden>
    <div class="ch-art" id="ch-art" aria-hidden="true"></div>
    <button id="ch-home" class="icon" data-label="menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="ch-card">
      <p class="ch-step" id="ch-step"></p>
      <p class="ch-year" id="ch-year"></p>
      <svg class="ch-rule" viewBox="0 0 220 12" aria-hidden="true">
        <path d="M2 6H96M124 6H218" pathLength="1"/>
        <path d="M110 1L116 6L110 11L104 6Z" pathLength="1"/>
      </svg>
      <h2 class="ch-title" id="ch-title"></h2>
      <p class="ch-story" id="ch-story"></p>
      <p class="ch-medal" id="ch-medal" hidden></p>
      <p class="ch-goal-h" id="ch-goal-h" data-t="yourGoal"></p>
      <div class="ch-mode" id="ch-mode" role="group"></div>
      <p class="ch-goal" id="ch-goal"></p>
      <button type="button" class="primary" id="ch-go" data-t="toBattle"></button>
      <button type="button" class="link" id="ch-standings" data-t="seeStandings" hidden></button>
      <button type="button" class="link" id="ch-easy" data-t="tryEasy" hidden></button>
    </div>
  </section>

  <dialog id="togter">
    <form method="dialog">
      <h2 data-t="togterTitle"></h2>
      <p class="sub" data-t="togterLead"></p>
      <div class="field"><span data-t="togtLevel"></span><div class="pills" id="togt-level"></div></div>
      <ol class="togt-list" id="togt-list"></ol>
      <div class="buttons"><button value="cancel" data-t="back"></button></div>
    </form>
  </dialog>

  <dialog id="new-game">
    <form method="dialog">
      <h2 data-t="freeGame"></h2>
      <!-- The map first, and how it is won right under it; then the computer players; the people at
           this device, rarely changed, folded away. -->
      <section class="group">
        <div class="field"><span data-t="map"></span><div class="pills" data-name="map"></div>
          <p class="sub locked-note" id="locked-note" data-t="lockedMaps"></p></div>
        <div class="field"><span data-t="victory"></span><div class="pills" data-name="mode"></div></div>
      </section>
      <section class="group">
        <div class="field"><span data-t="computerPlayers"></span><div class="pills" data-name="opponents"></div></div>
        <div id="bot-fields">
          <div class="field"><span data-t="computerLevel"></span><div class="pills" data-name="level"></div></div>
        </div>
      </section>
      <details class="fold" id="people-fold">
        <summary><span><span data-t="peopleHere"></span>: <span id="people-names"></span></span></summary>
        <ol class="people" id="people"></ol>
        <button type="button" class="link add-person" id="add-person" data-t="addPerson"></button>
      </details>
      <p class="sub" data-t="fairStart"></p>
      <div class="buttons">
        <button value="cancel" id="cancel-new" data-t="back"></button>
        <button value="start" class="primary" id="start" data-t="start"></button>
      </div>
    </form>
  </dialog>

  <dialog id="settings">
    <form method="dialog">
      <h2 data-t="settings"></h2>
      <div class="field"><span data-t="sound"></span><div class="pills" id="sound-pills"></div></div>
      <div class="field"><span data-t="music"></span><div class="pills" id="music-pills"></div></div>
      <div class="field"><span data-t="look"></span><div class="pills" id="theme-pills"></div></div>
      <div class="field"><span data-t="playerColors"></span><div class="pills" id="palette-pills"></div></div>
      <div class="field"><span data-t="language"></span><div class="pills" id="lang-pills"></div></div>
      <div class="buttons"><button value="ok" class="primary" data-t="ok">OK</button></div>
    </form>
  </dialog>

  <dialog id="mission-dialog">
    <form method="dialog">
      <h2 id="mission-title" data-t="yourMission"></h2>
      <p class="sub" id="mission-who"></p>
      <p id="mission-text" class="big"></p>
      <div id="mission-map" class="mission-map"></div>
      <p id="mission-progress"></p>
      <p class="sub" id="mission-note" data-t="missionSecret"></p>
      <div class="buttons"><button value="ok" class="primary" data-t="ok">OK</button></div>
    </form>
  </dialog>

  <dialog id="luck-dialog">
    <form method="dialog">
      <h2 data-t="luck"></h2>
      <p class="sub" id="luck-who"></p>
      <p class="stars-big" id="luck-stars"></p>
      <p id="luck-text"></p>
      <ul class="luck-rules">
        <li data-t="luckRule1"></li>
        <li data-t="luckRule2"></li>
      </ul>
      <div id="ladder"></div>
      <ul class="luck-rules">
        <li data-t="luckRule3"></li>
      </ul>
      <div class="buttons">
        <button value="ok" data-t="ok">OK</button>
        <button value="luck" class="primary" id="cash-btn" data-t="cashIn"></button>
      </div>
    </form>
  </dialog>

  <dialog id="game-over" data-label="gameOver">
    <form method="dialog">
      <div class="ruler" id="over-ruler"></div>
      <div id="over-text"></div>
      <div class="buttons">
        <button value="home" data-t="toStart"></button>
        <button value="again" class="primary" id="over-again"></button>
      </div>
    </form>
  </dialog>

  <!-- The menu in the corner of a game. The game waits while it is open. -->
  <dialog id="replace-dialog">
    <form method="dialog">
      <h2 data-t="replaceTitle"></h2>
      <p data-t="replaceText"></p>
      <div class="buttons">
        <button value="keep" data-t="replaceKeep"></button>
        <button value="new" class="primary" data-t="replaceNew"></button>
      </div>
    </form>
  </dialog>

  <!-- The medals won on the togter and the numbers of the games played (js/stats.js). -->
  <dialog id="stats">
    <form method="dialog">
      <h2 data-t="stats"></h2>
      <div class="medals" id="stats-medals"></div>
      <p class="sub" data-t="statsMedalsNote"></p>
      <dl class="numbers" id="stats-numbers"></dl>
      <p class="sub" id="stats-empty" data-t="statsEmpty"></p>
      <h3 id="stats-fastest-h" data-t="fastestH"></h3>
      <ol class="fastest" id="stats-fastest"></ol>
      <div class="buttons"><button value="ok" class="primary" data-t="back"></button></div>
    </form>
  </dialog>

  <dialog id="game-menu">
    <form method="dialog">
      <h2 data-t="menu"></h2>
      <button type="button" class="wide" id="menu-how-to" data-t="howToPlay"></button>
      <div class="field"><span data-t="sound"></span><div class="pills" id="menu-sound"></div></div>
      <div class="field"><span data-t="music"></span><div class="pills" id="menu-music"></div></div>
      <div class="field"><span data-t="language"></span><div class="pills" id="menu-lang"></div></div>
      <div class="buttons">
        <button value="home" id="menu-home" data-t="home"></button>
        <button value="ok" class="primary" data-t="back"></button>
      </div>
    </form>
  </dialog>

  <!-- How to play: a booklet, with scenes that play while they are in view (js/how-to.js). -->
  <dialog id="how-to">
    <form method="dialog">
      <button class="icon book-close" value="close" data-label="back"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <header class="book-cover"><h2 data-t="howToPlay"></h2></header>
      <div class="book">
        <h3 data-t="htGoalH"></h3>
        <div data-html="htGoal"></div>

        <h3 data-t="htTurnH"></h3>
        <p data-t="htTurn"></p>
        <h4><i>1</i><span data-t="htPlaceH"></span></h4>
        <div class="book-scene" data-scene="reinforce"></div>
        <div data-html="htPlace"></div>
        <h4><i>2</i><span data-t="htAttackH"></span></h4>
        <div class="book-scene" data-scene="attack"></div>
        <div data-html="htAttack"></div>
        <h4><i>3</i><span data-t="htMoveH"></span></h4>
        <div class="book-scene" data-scene="move"></div>
        <div data-html="htMove"></div>

        <h3 data-t="htRegionH"></h3>
        <div class="book-scene" data-scene="region"></div>
        <div data-html="htRegion"></div>

        <h3 data-t="luck"></h3>
        <div class="book-scene" data-scene="luck"></div>
        <div data-html="htLuck"></div>

        <h3 data-t="htSeaH"></h3>
        <div class="book-scene" data-scene="sea"></div>
        <div data-html="htSea"></div>

        <h3 data-t="htPeopleH"></h3>
        <div data-html="htPeople"></div>

        <button value="close" class="primary wide book-done" data-t="back"></button>
        <p class="credits" data-html="credits"></p>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
